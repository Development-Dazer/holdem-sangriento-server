services:
  - type: web
    name: holdem-sangriento-server
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LEADERBOARD_SEASON
        value: preseason-1
      - key: RELEASE_VERSION
        value: 2.2.0
